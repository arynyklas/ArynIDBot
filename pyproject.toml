[project]
name = "aryn-id-bot"
version = "2.0.0"
description = "Telegram bot that shows IDs: users, chats, messages, media DCs, sticker pack owners, and voice and photo platforms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "telethon>=1.44.0",
    "cryptg>=0.6.0",
    "adaptix>=3.0.0b12",
    "dature[yaml]>=1.6.0,<2",
    "pymongo>=4.18",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "pre-commit>=4.0.1",
]
tests = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

lint.select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "S",     # bandit
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "G",     # flake8-logging-format
    "PL",    # Pylint
    "RUF",   # Ruff-specific
]

lint.ignore = [
    "E501",    # Line too long (handled by the formatter)
    "S101",    # Use of `assert`
    "S311",    # Pseudo-random generators
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
]

lint.fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Tests embed fake tokens; S105 flags the literal, not a real leak.
# PLR0917: pytest injects fixtures by name, never positionally.
"tests/*" = ["S101", "S105", "ANN", "PLR2004", "PLR0917", "SIM117"]
"scripts/*" = ["T201", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.ruff.lint.pylint]
max-locals = 15
max-branches = 12
max-statements = 50
